<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Competition Platform">
  <title>Competition Platform — Real-time competitions</title>
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="55%" stop-color="#3b3ae0" />
      <stop offset="100%" stop-color="#7c5cff" />
    </linearGradient>
    <radialGradient id="og-glow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#og-glow)" />

  <!-- Cypher mark -->
  <g transform="translate(96 96)">
    <path
      d="M 110 28 A 50 50 0 1 0 110 72"
      fill="none"
      stroke="#ffffff"
      stroke-width="18"
      stroke-linecap="round"
    />
    <circle cx="50" cy="50" r="11" fill="#ffffff" />
  </g>

  <!-- Status pill -->
  <g transform="translate(96 248)">
    <rect width="170" height="38" rx="19" fill="#ffffff" fill-opacity="0.16" />
    <circle cx="22" cy="19" r="5" fill="#ffffff" />
    <text
      x="38" y="25"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
      font-size="15" font-weight="600" letter-spacing="0.08em"
      fill="#ffffff"
    >LIVE IN PRODUCTION</text>
  </g>

  <!-- Headline -->
  <text
    x="96" y="380"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="84" font-weight="700" letter-spacing="-0.025em"
    fill="#ffffff"
  >Real-time competitions,</text>
  <text
    x="96" y="466"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="84" font-weight="700" letter-spacing="-0.025em"
    fill="#ffffff" fill-opacity="0.85"
  >run end-to-end.</text>

  <!-- Subhead -->
  <text
    x="96" y="528"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="26" font-weight="400"
    fill="#ffffff" fill-opacity="0.75"
  >Cypher → Battles · judge anywhere · audit everything</text>

  <!-- Wordmark bottom -->
  <text
    x="96" y="590"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="22" font-weight="600" letter-spacing="0.04em"
    fill="#ffffff"
  >COMPETITION PLATFORM</text>
</svg>
