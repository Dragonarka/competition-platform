<text x="1060.0" y="271.0" font-size="13" fill="#c92a2a" text-anchor="middle" font-weight="normal">FIX: dev CORS now allows any localhost port</text>
<text x="75" y="874.0" font-size="14" fill="#495057" text-anchor="start" font-weight="normal">LOCAL DEV PORTS   —   web :3000   ·   API :3001   ·   Postgres :5432   ·   Redis :6379   ·   langfuse remapped 3000 → 3010 (was colliding with web)</text>
<text x="75" y="902.0" font-size="12" fill="#868e96" text-anchor="start" font-weight="normal">Root cause of breakage: API CORS was pinned to :3000; langfuse squatted :3000, pushing web to another port → every tRPC/WS call blocked (login = Clerk, exempt). Now fixed at both layers.</text>
