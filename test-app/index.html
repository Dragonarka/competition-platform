<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competition Platform - QA Test Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .container { max-width: 600px; width: 100%; padding: 2rem; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #38bdf8; }
    p { color: #94a3b8; margin-bottom: 2rem; }
    .card { background: #1e293b; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #334155; }
    .card h2 { font-size: 1.1rem; margin-bottom: 0.5rem; }
    .card p { margin-bottom: 0; font-size: 0.9rem; }
    button { background: #3b82f6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: background 0.2s; }
    button:hover { background: #2563eb; }
    #status { margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none; }
    #status.success { display: block; background: #065f46; border: 1px solid #10b981; }
    #status.error { display: block; background: #7f1d1d; border: 1px solid #ef4444; }
    input { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 1rem; margin-bottom: 1rem; }
    input:focus { outline: none; border-color: #3b82f6; }
    .counter { font-size: 3rem; font-weight: bold; color: #38bdf8; text-align: center; margin: 1rem 0; }
    .btn-group { display: flex; gap: 0.5rem; justify-content: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Competition Platform</h1>
    <p>QA Validation Test Page</p>

    <div class="card">
      <h2>Player Registration</h2>
      <input type="text" id="playerName" placeholder="Enter player name" aria-label="Player name">
      <input type="email" id="playerEmail" placeholder="Enter email" aria-label="Player email">
      <button id="registerBtn" onclick="registerPlayer()">Register</button>
      <div id="status"></div>
    </div>

    <div class="card">
      <h2>Score Counter</h2>
      <div class="counter" id="score">0</div>
      <div class="btn-group">
        <button onclick="updateScore(-1)">- 1</button>
        <button onclick="updateScore(1)">+ 1</button>
        <button onclick="updateScore(10)">+ 10</button>
        <button onclick="resetScore()">Reset</button>
      </div>
    </div>

    <div class="card">
      <h2>Connection Status</h2>
      <p id="connectionStatus">Disconnected</p>
      <button onclick="toggleConnection()">Connect</button>
    </div>
  </div>

  <script>
    let score = 0;
    let connected = false;

    function registerPlayer() {
      const name = document.getElementById('playerName').value;
      const email = document.getElementById('playerEmail').value;
      const status = document.getElementById('status');

      if (!name || !email) {
        status.textContent = 'Error: Please fill in all fields';
        status.className = 'error';
        return;
      }

      if (!email.includes('@')) {
        status.textContent = 'Error: Invalid email format';
        status.className = 'error';
        return;
      }

      status.textContent = `Success! Player "${name}" registered with ${email}`;
      status.className = 'success';
      console.log(`Player registered: ${name} (${email})`);
    }

    function updateScore(delta) {
      score += delta;
      if (score < 0) score = 0;
      document.getElementById('score').textContent = score;
      console.log(`Score updated: ${score}`);
    }

    function resetScore() {
      score = 0;
      document.getElementById('score').textContent = score;
      console.log('Score reset');
    }

    function toggleConnection() {
      connected = !connected;
      const statusEl = document.getElementById('connectionStatus');
      const btn = event.target;
      if (connected) {
        statusEl.textContent = 'Connected (WebSocket simulated)';
        statusEl.style.color = '#10b981';
        btn.textContent = 'Disconnect';
        console.log('WebSocket connected');
      } else {
        statusEl.textContent = 'Disconnected';
        statusEl.style.color = '#94a3b8';
        btn.textContent = 'Connect';
        console.log('WebSocket disconnected');
      }
    }
  </script>
</body>
</html>
