<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Competition Platform — Docs</title>
    <meta name="description" content="Real-time WebSocket competition platform with game theory fairness. Architecture, workflows, and deploy guide." />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
    <style>
      :root {
        --theme-color: #0891b2;
        --sidebar-width: 18rem;
      }
      .sidebar { font-size: 14px; }
      .markdown-section { max-width: 960px; }
      .markdown-section h1 { color: #0f172a; }
      .markdown-section h2 { color: #0891b2; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.3em; margin-top: 2em; }
      .markdown-section table { width: 100%; display: table; }
      .markdown-section pre { background: #0f172a; }
      .markdown-section pre > code { background: transparent; color: #e2e8f0; }
      .markdown-section code:not([class*="language-"]) { background: #f1f5f9; color: #be123c; padding: 0.2em 0.4em; border-radius: 3px; font-size: 0.85em; }
      .mermaid { background: #fff; padding: 1rem; border-radius: 6px; margin: 1rem 0; text-align: center; }
      .app-name-link img { max-width: 40px; }
      .cover-main h1 { margin-bottom: 0.5rem; }
    </style>
  </head>
  <body>
    <div id="app">Loading…</div>
    <script>
      window.$docsify = {
        name: 'Competition Platform',
        repo: 'https://github.com/Dragonarka/competition-platform',
        loadSidebar: true,
        subMaxLevel: 2,
        auto2top: true,
        homepage: 'index.md',
        relativePath: true,
        search: {
          maxAge: 86400000,
          paths: 'auto',
          placeholder: 'Search docs',
          noData: 'No results.',
          depth: 4,
        },
        copyCode: {
          buttonText: 'Copy',
          errorText: 'Failed',
          successText: 'Copied',
        },
        markdown: {
          renderer: {
            code(code, lang) {
              if (lang === 'mermaid') {
                return `<div class="mermaid">${code}</div>`;
              }
              return this.origin.code.apply(this, arguments);
            },
          },
        },
        plugins: [
          function (hook) {
            hook.doneEach(function () {
              if (window.mermaid) {
                window.mermaid.run({ querySelector: '.mermaid' });
              }
            });
          },
        ],
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
      mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
      window.mermaid = mermaid;
    </script>
  </body>
</html>
