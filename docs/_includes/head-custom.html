<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  // Convert GitHub-style ```mermaid blocks (rendered as <pre><code class="language-mermaid">)
  // into <div class="mermaid"> so mermaid.run() picks them up.
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('pre code.language-mermaid').forEach((code) => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
    mermaid.run();
  });
</script>
<style>
  .mermaid { background: #fff; padding: 1rem; border-radius: 6px; margin: 1rem 0; text-align: center; }
  .main-content table { display: table; width: 100%; }
  .main-content code { font-size: 0.85rem; }
</style>
